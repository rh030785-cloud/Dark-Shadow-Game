name: Build Dark Shadow Game APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download game files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame

      - name: Check game files
        run: |
          echo "Checking repository files..."
          ls -la

      - name: Create game package
        run: |
          mkdir -p game-package
          cp -r . game-package/ || true
          tar -czf Dark-Shadow-Game.tar.gz game-package

      - name: Upload game package
        uses: actions/upload-artifact@v4
        with:
          name: Dark-Shadow-Game
          path: Dark-Shadow-Game.tar.gz
